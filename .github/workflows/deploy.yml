name: Deploy PR Review Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-review-cloud-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Set the production D1 binding
        env:
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const databaseId = process.env.D1_DATABASE_ID ?? '';
          if (!/^[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}$/i.test(databaseId)) {
            throw new Error('Set D1_DATABASE_ID to the production D1 database UUID');
          }
          const config = JSON.parse(readFileSync('wrangler.jsonc', 'utf8'));
          config.d1_databases[0].database_id = databaseId;
          writeFileSync('wrangler.deploy.json', JSON.stringify(config));
          JS
      - name: Apply D1 migrations and deploy the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --no-install wrangler d1 migrations apply DB --remote --config wrangler.deploy.json
          npx --no-install wrangler deploy --config wrangler.deploy.json
      - name: Check public routes
        run: |
          body="$RUNNER_TEMP/pr-review-cloud-smoke.html"
          for path in / /sample; do
            status=$(curl -fsSL --retry 3 --max-time 20 --output "$body" --write-out '%{http_code}' "https://app.gggodlin.com$path")
            test "$status" = 200
            grep -F '<meta name="pr-review-cloud-version" content="1">' "$body"
          done
